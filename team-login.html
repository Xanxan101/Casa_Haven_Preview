<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Haven — Team Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<section class="admin-console" aria-label="Casa Haven private administration">
  <section id="admin-login" class="admin-login" hidden>
    <div class="admin-login-card">
      <span class="admin-eyebrow">Casa Haven private access</span>
      <h1 id="admin-login-title">Team sign in</h1>
      <p>Sign in with your registered email and password. You'll land in the owner or staff console depending on your account. Customer accounts cannot access either.</p>
      <form id="admin-login-form">
        <label for="admin-login-email">Registered email</label>
        <input id="admin-login-email" type="email" autocomplete="username" placeholder="name@casahaven.ph" required>
        <label for="admin-login-password">Password</label>
        <input id="admin-login-password" type="password" autocomplete="current-password" required>
        <button type="submit" class="admin-btn brass">Continue</button>
        <p id="admin-login-error" class="admin-login-error" role="alert" hidden></p>
      </form>
      <a class="admin-login-exit" href="index.html">Return to Casa Haven</a>
    </div>
  </section>
</section>

<script type="module" src="admin-login.js"></script>
</body>
</html>
